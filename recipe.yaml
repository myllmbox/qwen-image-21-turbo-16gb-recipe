# The one and only config. run.sh reads THIS — there is nothing else to configure.

server:
  image: myllmbox/qwen-image-21-turbo-hibrid:v1        # pinned public tag
  model: myllmbox/Qwen-Image-2.1-Turbo-hibrid          # HF repo — downloaded into ./models on first run (~14.5G)
  port: 8000
  models_dir: ./models
  cache_dir: ./cache
  min_free_vram_mib: 15000                             # run.sh refuses to start below this much free GPU memory (a card that
                                                       # also drives your desktop has less free)

env:
  SERVED_MODEL_NAME: Qwen-Image-2.1-Turbo-hibrid
  DEFAULT_SIZE: "1:1"                                  # size when a generation request names none: 1:1 3:2 2:3 4:3 3:4 16:9 9:16 or WxH
  MAX_N: "4"                                           # images per request
  MAX_PROMPTS: "8"                                     # prompts per request (a list of prompts = one image each)
  PYTHONUNBUFFERED: "1"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
